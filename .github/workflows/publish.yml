name: publish-congress-trades

on:
  schedule:
    - cron: "20 22 * * 1-5"   # weekdays, after US close (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build feed
        run: |
          python src/build_feed.py
          python scripts/post_text.py
      - name: Publish out/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Served at: https://<user>.github.io/congress_trades/congress_trades.json
